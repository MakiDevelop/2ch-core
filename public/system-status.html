<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>系統狀態 - 2ch.tw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .refresh-info {
            background: #1a1a1a;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #5b8ef4;
        }

        .refresh-info .time {
            color: #999;
            font-size: 14px;
        }

        .refresh-btn {
            background: #5b8ef4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #4a7de3;
        }

        .refresh-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #ffffff;
            border-bottom: 2px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: #252525;
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid #5b8ef4;
        }

        .stat-card.warning {
            border-left-color: #f4a742;
        }

        .stat-card.error {
            border-left-color: #f44242;
        }

        .stat-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }

        .stat-unit {
            font-size: 14px;
            color: #999;
            margin-left: 4px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .table th {
            background: #252525;
            color: #999;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
        }

        .table td {
            color: #e0e0e0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-running {
            background: rgba(91, 142, 244, 0.2);
            color: #5b8ef4;
        }

        .status-error {
            background: rgba(244, 66, 66, 0.2);
            color: #f44242;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 18px;
        }

        .error-message {
            background: rgba(244, 66, 66, 0.1);
            border: 1px solid #f44242;
            color: #f44242;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #5b8ef4;
            transition: width 0.3s;
        }

        .progress-fill.warning {
            background: #f4a742;
        }

        .progress-fill.error {
            background: #f44242;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .refresh-info {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>

    }
    </script>
</head>
<body>
    <div class="container">
        <h1>🔧 系統狀態監控</h1>
        <p class="subtitle">2ch.tw System Status Dashboard</p>

        <div class="refresh-info">
            <div class="time">最後更新：<span id="last-update">-</span></div>
            <button class="refresh-btn" id="refresh-btn">重新整理</button>
        </div>

        <div id="error-container"></div>
        <div id="content">
            <div class="loading">載入中...</div>
        </div>
    </div>

    <script src="/js/system-status.js?v=20260206"></script>
</body>
</html>
