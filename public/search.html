<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜尋 - 2ch.tw</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="2ch.tw 全站搜尋 - 搜尋討論串標題與內容">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://2ch.tw/search.html">

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme-init.js"></script>
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-primary, #ddd);
            border-radius: 8px;
            background: var(--bg-secondary, #fff);
            color: var(--text-primary, #333);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color, #5b8ef4);
        }

        .search-box button {
            padding: 12px 24px;
            font-size: 16px;
            background: var(--accent-color, #5b8ef4);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-info {
            font-size: 14px;
            color: var(--text-muted, #777);
            margin-bottom: 20px;
        }

        .search-results {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .search-result-item {
            display: block;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--bg-secondary, #fff);
            border: 1px solid var(--border-primary, #ddd);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }

        .search-result-item:hover {
            border-color: var(--accent-color, #5b8ef4);
        }

        .result-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary, #333);
            margin-bottom: 8px;
        }

        .result-content {
            font-size: 14px;
            color: var(--text-secondary, #666);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .result-meta {
            font-size: 13px;
            color: var(--text-muted, #999);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .result-meta .board {
            color: var(--accent-color, #5b8ef4);
        }

        .result-meta .replies {
            color: var(--success-color, #51cf66);
        }

        .search-status {
            text-align: center;
            padding: 40px;
            color: var(--text-muted, #777);
        }

        .cooldown-timer {
            color: var(--error-color, #ff6b6b);
            font-weight: 500;
        }

        .highlight {
            background: rgba(91, 142, 244, 0.2);
            padding: 1px 2px;
            border-radius: 2px;
        }
    </style>
    <!-- Google Analytics (GA4) - production only -->
    <script>
    if(location.hostname==='2ch.tw'){
      var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-076PY695Z4';document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-076PY695Z4');
    }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="/" style="text-decoration: none; color: inherit;">2ch.tw</a></h1>
            <p class="subtitle">匿名討論版 - 對事不對人</p>
        </header>

        <div class="search-container">
            <h2 style="margin-bottom: 20px;">全站搜尋</h2>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="輸入關鍵字搜尋討論串..." maxlength="50" autofocus>
                <button id="search-btn">搜尋</button>
            </div>

            <div class="search-info">
                <span id="cooldown-display"></span>
                <span>搜尋討論串標題與內文，至少 2 個字元，每 10 秒可搜尋一次</span>
            </div>

            <div id="search-status" class="search-status" style="display: none;"></div>

            <ul id="search-results" class="search-results"></ul>
        </div>

        <footer>
            <p>&copy; 2026 Maki's Digital Atelier. All Rights Reserved. <a href="/">返回首頁</a></p>
        </footer>
    </div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="切換深色模式">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
    </button>

    <!-- Bookmark feature -->
    <script src="/js/bookmark.js?v=20260117"></script>
    <script src="/js/search.js?v=20260206"></script>
</body>
</html>
